<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Vanshika 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Parisienne&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#2e001f,#680026);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    overflow:hidden;
}

.container{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    padding:2rem;
    border-radius:20px;
    width:650px;
    text-align:center;
    display:none;
    flex-direction:column;
}

.container.active{display:flex;}

h1{
    font-family:'Parisienne',cursive;
    font-size:3rem;
    color:#ff99ac;
    margin-bottom:1rem;
}

.btn{
    padding:12px 30px;
    border:none;
    border-radius:40px;
    background:linear-gradient(45deg,#ff3366,#ff6b6b);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    margin:10px;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.gallery-grid img{
    width:100%;
    height:130px;
    object-fit:cover;
}

#noBtn{
    background:#555;
}

.letter-content{
    font-family:'Dancing Script',cursive;
    font-size:1.6rem;
    text-align:left;
    background:rgba(255,255,255,0.9);
    color:#333;
    padding:20px;
    border-radius:10px;
    min-height:200px;
}

.cursor::after{
    content:"|";
    animation:blink 1s infinite;
}
@keyframes blink{
    50%{opacity:0;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="container active" id="screen-intro">
    <h1>Hey Handsome... ✨</h1>
    <p>I have something special to show you.</p>
    <button class="btn" onclick="nextScreen('screen-gallery')">Start Journey ❤️</button>
</div>

<!-- GALLERY -->
<div class="container" id="screen-gallery">
    <h1>Our Memories 📸</h1>
    <p>Every moment with you is a treasure.</p>
    <div class="gallery-grid">
        <img src="pic1.jpg">
        <img src="pic2.jpg">
        <img src="pic3.jpg">
        <img src="pic4.jpg">
    </div>
    <button class="btn" onclick="nextScreen('screen-letter')">Next →</button>
</div>

<!-- LETTER -->
<div class="container" id="screen-letter">
    <h1>For You... 💌</h1>
    <div class="letter-content">
        <span id="typewriter"></span><span class="cursor"></span>
    </div>
    <button class="btn" id="letterNext" style="opacity:0;pointer-events:none;"
        onclick="nextScreen('screen-proposal')">One Last Thing...</button>
</div>

<!-- PROPOSAL -->
<div class="container" id="screen-proposal">
    <h1>Will You Be My Valentine? 🌹</h1>
    <p>You are my cupcake, Mr. Browine and dear diary.</p>
    <div>
        <button class="btn" onclick="acceptProposal()">YES! 😍</button>
        <button class="btn" id="noBtn" onmouseover="moveNo()">No 😢</button>
    </div>
</div>

<!-- CELEBRATION -->
<div class="container" id="screen-celebration">
    <h1>I Knew It! 💖</h1>
    <p>I love you so much! 🥰</p>
</div>

<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<script>
const YOUR_EMAIL="Vanshikagupta2321@gmail.com";

// SCREEN SWITCH
function nextScreen(id){
    document.querySelectorAll(".container").forEach(c=>c.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if(id==="screen-letter") startTyping();
}

// EXACT LETTER FROM YOUR IMAGE
const letterText=`Hi my Tequilla shot,

I myself have no clue , when i started in loving you this much . I mean i realised that i do love you , but i loved is that you have flaws  there is some spark and lotw of ups and downs.  ,  .

I cherish every moment we share, and I want to create a million more memories with you.

So, I have a very important question...`;

let i=0;

function startTyping(){
    document.getElementById("typewriter").innerHTML="";
    i=0;
    type();
}

function type(){
    if(i<letterText.length){
        const ch=letterText[i]==="\n"?"<br>":letterText[i];
        document.getElementById("typewriter").innerHTML+=ch;
        i++;
        setTimeout(type,35);
    }else{
        const btn=document.getElementById("letterNext");
        btn.style.opacity=1;
        btn.style.pointerEvents="auto";
    }
}

// NO RUNS
function moveNo(){
    const b=document.getElementById("noBtn");
    b.style.position="fixed";
    b.style.left=Math.random()*(window.innerWidth-100)+"px";
    b.style.top=Math.random()*(window.innerHeight-50)+"px";
}

// YES
function acceptProposal(){
    nextScreen("screen-celebration");
    sendMail();
}

function sendMail(){
    fetch(`https://formsubmit.co/ajax/${YOUR_EMAIL}`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
        },
        body:JSON.stringify({
            subject:"SHE SAID YES 💖",
            message:"Your valentine accepted ❤️",
            time:new Date().toLocaleString()
        })
    });
}

// MUSIC START
document.body.addEventListener("click",()=>{
    document.getElementById("bgMusic").play();
},{once:true});
</script>

</body>
</html>
